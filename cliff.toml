# git-cliff: конфигурация «Волны». Проверена спайком на git-cliff 2.14.2,
# см. RELEASING.md §10.

[changelog]
header = """
# Changelog

All notable changes to Volna. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and this project adheres to
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). User-facing release notes
are written separately (see RELEASING.md §4).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} — **breaking**{% endif %}
{% endfor -%}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
{% if release.version and release.previous and release.previous.version -%}
[{{ release.version }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..{{ release.version }}
{% elif release.version -%}
[{{ release.version }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/tree/{{ release.version }}
{% elif release.previous and release.previous.version -%}
[unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}..HEAD
{% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^change", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^fix", group = "Fixed" },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^build", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
    { message = "^chore", skip = true },
    { message = "^Merge", skip = true },
]

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false

[remote.github]
owner = "FRiMN"
repo = "volna"
