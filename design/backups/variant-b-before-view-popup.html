<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Волна — файловый менеджер</title>
<style>
/* ============================================================
   Волна · вариант B «JetBrains Workbench»
   JetBrains New UI chassis: 40px chrome rhythm, 24px data rows,
   flat two-surface dark theme.  All values are tokens.
   ============================================================ */

:root{
  color-scheme: dark;

  --font-ui: Inter, "JetBrains Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* dark surfaces */
  --bg-canvas:      #1e1f22;
  --bg-chrome:      #2b2d30;
  --bg-chrome-alt:  #26282d;
  --divider-gap:    #1e1f22;
  --divider-line:   #393b40;
  --text-primary:   #dfe1e5;
  --text-secondary: #9da0a8;
  --text-disabled:  #6f737a;
  --text-code:      #bcbec3;
  --icon-primary:   #ced0d6;
  --icon-secondary: #6f737a;
  --accent:         #3574f0;
  --accent-soft:    #25324d;
  --accent-text-on: #ffffff;
  --row-selected:   #43454a;
  --row-selected-focused: #1d2432;
  --hover:          #393b40;
  --scrollbar:      #5b5d5f;
  --error:          #db5c5c;
  --warning:        #f2c55c;
  --success:        #57965c;

  /* derived */
  --inset:       #1e1f22;
  --field-bg:    #1e1f22;
  --field-border:#393b40;
  --menu-bg:     #2b2d30;
  --menu-line:   #393b40;

  /* main toolbar stays dark in both themes (JetBrains signature) */
  --tb-bg:       #2b2d30;
  --tb-text:     #dfe1e5;
  --tb-icon:     #ced0d6;
  --tb-hover:    #393b40;
  --tb-divider:  #393b40;
  --tb-disabled: #6f737a;

  /* folder glyph */
  --folder-back:  #3a6bd0;
  --folder-front: #4d8ef0;

  /* chrome rhythm */
  --row-h: 24px;
  --chrome-h: 40px;
  --stripe-w: 40px;
  --panel-l: 300px;
  --panel-r: 320px;
  --ws-h: 608px;
  --bw-h: 180px;

  --ease: cubic-bezier(.3,.7,.4,1);
}

html[data-theme="light"]{
  color-scheme: light;
  --bg-canvas:      #ffffff;
  --bg-chrome:      #f7f8fa;
  --bg-chrome-alt:  #f2f3f5;
  --divider-gap:    #dfe1e5;
  --divider-line:   #ebecf0;
  --text-primary:   #000000;
  --text-secondary: #6d707d;
  --text-disabled:  #a8adbd;
  --text-code:      #6d707d;
  --icon-primary:   #6c707e;
  --icon-secondary: #818594;
  --accent:         #3574f0;
  --accent-soft:    #e7effd;
  --accent-text-on: #ffffff;
  --row-selected:   #dfe1e5;
  --row-selected-focused: #e9eef9;
  --hover:          #eceff1;
  --scrollbar:      #c4c4c4;
  --error:          #db3b4b;
  --warning:        #e6a817;
  --success:        #208a3c;

  --inset:       #f2f3f5;
  --field-bg:    #ffffff;
  --field-border:#ebecf0;
  --menu-bg:     #ffffff;
  --menu-line:   #ebecf0;

  --tb-bg:       #27282d;
  --tb-text:     #ffffff;
  --tb-icon:     #d6d7db;
  --tb-hover:    #3b3d44;
  --tb-divider:  #3e4048;
  --tb-disabled: #6b6f78;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:
    radial-gradient(58% 46% at 50% 26%, rgba(90,104,128,.28), rgba(0,0,0,0) 68%),
    radial-gradient(140% 120% at 50% 40%, #23262c 0%, #17191d 52%, #0c0d10 100%);
  color:var(--text-primary);
  font-family:var(--font-ui);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- icon primitives ------------------------------------ */
.ic{
  display:block; flex:none;
  fill:none; stroke:currentColor;
  stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round;
}
.fb{fill:var(--folder-back); stroke:none}
.ff{fill:var(--folder-front); stroke:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- studio stage + application window ------------------- */
.stage{
  position:fixed; inset:0;
  display:grid; place-items:center;
  overflow:hidden;
}
.window{
  width:1440px; height:900px;
  border-radius:8px;
  overflow:hidden;
  background:var(--bg-canvas);
  display:grid;
  grid-template-rows:40px 1px 40px 1px var(--ws-h) 1px var(--bw-h) 1px 28px;
  transform:scale(var(--win-scale,1));
  transform-origin:center center;
  box-shadow:0 0 0 1px rgba(6,7,9,.9), 0 42px 90px -34px rgba(0,0,0,.85), 0 12px 32px -18px rgba(0,0,0,.6);
}
.window.no-left{--panel-l:0px}
.window.no-right{--panel-r:0px}
.window.no-bottom{--bw-h:0px; --ws-h:788px}

.sep{background:var(--divider-gap)}
.sep-line{background:var(--divider-gap); display:grid; grid-template-columns:40px minmax(0,1fr) 40px; overflow:hidden}
.sep-line > i{display:block; background:var(--divider-line)}
.sep-line > i:first-child, .sep-line > i:last-child{background:var(--bg-chrome)}

/* ---------- shared controls ------------------------------------ */
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:1px solid var(--accent); outline-offset:-1px}

.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:28px; height:28px; border-radius:4px;
  color:var(--icon-primary);
  transition:background-color 90ms var(--ease), color 90ms var(--ease);
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{background:var(--row-selected)}
.icon-btn.sm{width:24px;height:24px}
.icon-btn.lg{width:32px;height:32px}
.icon-btn[disabled]{color:var(--text-disabled); cursor:default; background:none}

/* ---------- 1 · main toolbar ----------------------------------- */
.toolbar{
  background:var(--tb-bg);
  display:flex; align-items:center;
  padding-left:6px;
  color:var(--tb-text);
  user-select:none;
}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px}
.tb-left{flex:1 1 auto;min-width:0}
.tb-right{flex:none}
.tb-right .icon-btn{color:var(--tb-icon)}
.tb-right .icon-btn:hover{background:var(--tb-hover)}
.tb-right .icon-btn:active{background:#45474d}
.tb-right .icon-btn[disabled]{color:var(--tb-disabled)}
.nav-group{display:flex;align-items:center;gap:2px}
.nav-group .icon-btn{width:24px;height:24px;color:var(--tb-icon)}
.nav-group .icon-btn:hover{background:var(--tb-hover)}
.nav-group .icon-btn:active{background:#45474d}
.vdiv{width:1px;height:16px;background:var(--tb-divider);flex:none}

.widget{
  position:relative;
  display:flex; align-items:center; gap:6px;
  height:28px; padding:0 8px; border-radius:4px;
  color:var(--tb-text); font-size:13px;
  transition:background-color 90ms var(--ease);
}
.widget:hover{background:var(--tb-hover)}
.widget .ic{color:var(--tb-icon)}
.widget .w-chev{color:var(--tb-icon)}
.loc-path{font-variant-numeric:tabular-nums}
.winctl{display:flex;align-items:center;height:40px;margin-left:2px}
.wbtn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--tb-icon);
  transition:background-color 90ms var(--ease), color 90ms var(--ease);
}
.wbtn:hover{background:var(--tb-hover)}
.wbtn:active{background:#45474d}
.wbtn.wclose:hover{background:var(--error); color:#fff}

/* dropdown menus (inside-window menus stay flat: 1px line, no shadow) */
.menu{
  position:absolute; top:calc(100% + 4px); left:0; z-index:40;
  min-width:180px; padding:4px 0;
  background:var(--menu-bg); border:1px solid var(--menu-line); border-radius:4px;
  display:none;
}
.menu.open{display:block}
.menu-item{
  display:flex; align-items:center; gap:8px;
  width:100%; height:26px; padding:0 10px;
  font-size:12px; color:var(--text-primary); text-align:left;
}
.menu-item:hover{background:var(--hover)}
.menu-item .ic{color:var(--text-secondary)}
.menu-item .m-check{color:var(--accent); margin-left:auto}
.menu-sep{height:1px;background:var(--divider-line);margin:4px 0}

/* ---------- 3 · continuous header band ------------------------- */
.band{
  display:grid;
  grid-template-columns:var(--stripe-w) var(--panel-l) minmax(0,1fr) var(--panel-r) var(--stripe-w);
  background:var(--bg-chrome);
}
.stripe{
  background:var(--bg-chrome);
  display:flex; flex-direction:column; align-items:center;
  padding-top:4px; gap:0;
  user-select:none;
}
.stripe-btn{
  width:32px; height:32px; border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:background-color 90ms var(--ease), color 90ms var(--ease);
}
.stripe-btn:hover{background:var(--hover); color:var(--icon-primary)}
.stripe-btn:active{background:var(--row-selected)}
.stripe-btn.on{background:var(--row-selected); color:var(--icon-primary)}
.stripe-sep{width:20px;height:1px;background:var(--divider-line);margin:8px 0;flex:none}

.tw-head{
  background:var(--bg-chrome);
  display:flex; align-items:center; gap:6px;
  padding:0 8px 0 4px;
  min-width:0; overflow:hidden;
}
.tw-title{
  display:flex;align-items:center;gap:4px;
  height:24px;padding:0 4px;border-radius:4px;
  font-size:13px;font-weight:600;color:var(--text-primary);
  transition:background-color 90ms var(--ease);
}
button.tw-title:hover{background:var(--hover)}
.tw-title .ic{color:var(--text-secondary)}
.tw-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.tw-actions .icon-btn{color:var(--text-secondary)}
.tw-actions .icon-btn:hover{background:var(--hover); color:var(--icon-primary)}

.tabstrip{
  position:relative; z-index:2;
  background:var(--bg-canvas);
  display:flex; align-items:stretch;
  min-width:0;
}
.tab{
  position:relative;
  display:flex;align-items:center;gap:6px;
  padding:0 10px;
  font-size:13px; color:var(--text-secondary);
  transition:background-color 90ms var(--ease), color 90ms var(--ease);
  user-select:none;
}
.tab:hover{background:var(--hover); color:var(--text-primary)}
.tab.on{color:var(--text-primary); background:var(--bg-canvas)}
.tab.on::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px;
  height:3px; background:var(--accent);
}
.tab-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
.tab-x{
  display:none; align-items:center; justify-content:center;
  width:18px; height:18px; border-radius:4px; color:var(--text-secondary);
  transition:background-color 90ms var(--ease), color 90ms var(--ease);
}
.tab-x .ic{stroke-width:1.5}
.tab-x:hover{background:var(--row-selected); color:var(--text-primary)}
.tab.on .tab-x{display:inline-flex}
.tab:hover .tab-x{display:inline-flex}
.tab-empty{
  display:flex;align-items:center;padding:0 12px;
  font-size:12px;color:var(--text-disabled);
}

/* ---------- 5 · workspace -------------------------------------- */
.workspace{
  display:grid;
  grid-template-columns:var(--stripe-w) var(--panel-l) minmax(0,1fr) var(--panel-r) var(--stripe-w);
  background:var(--bg-canvas);
  overflow:hidden;
}
.panel{background:var(--bg-chrome); display:flex; flex-direction:column; min-width:0; overflow:hidden}
.panel-toolbar{
  height:32px; flex:none;
  display:flex; align-items:center; gap:6px;
  padding:0 6px 0 8px;
  background:var(--bg-chrome);
}
.search-field{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center; gap:6px;
  height:24px; padding:0 6px;
  background:var(--field-bg); border:1px solid var(--field-border); border-radius:4px;
  color:var(--text-secondary);
  transition:border-color 90ms var(--ease);
}
.search-field:focus-within{border-color:var(--accent)}
.search-field input{
  flex:1 1 auto; min-width:0; width:100%;
  background:none;border:0;outline:none;
  font-size:12px; color:var(--text-primary);
}
.search-field input::placeholder{color:var(--text-disabled)}
.panel-toolbar .icon-btn{color:var(--text-secondary); width:24px;height:24px}
.panel-toolbar .icon-btn:hover{background:var(--hover); color:var(--icon-primary)}

.scroll{overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--scrollbar) transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--text-secondary);background-clip:padding-box}

/* ---------- 3.4 left tool window «Места» ----------------------- */
.tree{flex:1 1 auto; min-height:0; padding-bottom:8px}
.trow{
  position:relative;
  display:flex; align-items:center; gap:6px;
  height:var(--row-h); padding-right:8px;
  font-size:13px; color:var(--text-primary);
  cursor:default;
  transition:background-color 90ms var(--ease);
}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--row-selected)}
.trow .texp{
  width:12px; height:12px; flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
}
.trow .texp .ic{stroke-width:1.5}
.trow .texp .rot{transition:transform 90ms var(--ease)}
.trow.closed .texp .rot{transform:rotate(-90deg)}
.trow .tico{color:var(--text-secondary)}
.trow .tlabel{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tgroup{font-size:12px; font-weight:600; color:var(--text-secondary); margin-top:4px}
.tgroup .tlabel{letter-spacing:0}
.usage{
  position:absolute; bottom:1px; left:24px; right:12px; height:3px;
  background:var(--divider-line); border-radius:2px; overflow:hidden;
}
.usage > i{display:block;height:100%;background:var(--error)}
.usage.warn > i{background:var(--warning)}

/* ---------- 3.5 editor ----------------------------------------- */
.editor{background:var(--bg-canvas); display:flex; flex-direction:column; min-width:0; overflow:hidden}
.crumbs{
  height:var(--row-h); flex:none;
  display:flex; align-items:center; gap:5px;
  padding:0 10px;
  font-size:12px; color:var(--text-secondary);
}
.crumbs .c-ico{color:var(--icon-secondary)}
.crumbs .c-chev{color:var(--text-disabled)}
.crumbs .c-last{color:var(--text-primary)}
.crumbs .c-sort{margin-left:auto; color:var(--text-secondary); font-size:11.5px}
.thead{
  height:var(--row-h); flex:none;
  display:grid; align-items:center;
  grid-template-columns:var(--cols, minmax(0,1fr) 90px 140px);
  padding:0 10px 0 8px;
  border-bottom:1px solid var(--divider-line);
  font-size:11.5px; color:var(--text-secondary);
}
.thead .h-name{text-align:left}
.thead .h-num{text-align:right}
.list{flex:1 1 auto; min-height:0; padding-bottom:4px}
.lrow{
  display:grid; align-items:center;
  grid-template-columns:var(--cols, minmax(0,1fr) 90px 140px);
  height:var(--row-h); padding:0 10px 0 8px;
  font-size:13px; color:var(--text-primary);
  cursor:default;
  transition:background-color 90ms var(--ease);
}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--row-selected-focused)}
.lrow.sel:hover{background:var(--row-selected-focused)}
.lname{display:flex;align-items:center;gap:7px;min-width:0}
.lname .ltext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnum{
  text-align:right;
  font-family:var(--font-mono); font-size:12px; color:var(--text-secondary);
  white-space:nowrap;
}
.group{
  position:relative;
  display:flex; align-items:center; gap:6px;
  height:var(--row-h); padding:0 10px 0 6px;
  font-size:12px; font-weight:600; color:var(--text-secondary);
  cursor:default;
}
.group::before{
  content:""; position:absolute; left:0; right:0; top:-1px; height:1px; background:var(--divider-line);
}
.group.first::before{display:none}
.group:hover{background:var(--hover)}
.group .gtexp{width:12px;height:12px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.group .gtexp .rot{transition:transform 90ms var(--ease)}
.group.closed .gtexp .rot{transform:rotate(-90deg)}
.group.closed .grot{display:none}
.group .glabel{white-space:nowrap}
.list-summary{
  padding:10px 10px 0 8px;
  text-align:right;
  font-size:12px; color:var(--text-secondary);
}
.icon-grid{
  display:flex; flex-wrap:wrap; gap:4px;
  padding:8px 4px 0 8px;
}
.icon-cell{
  width:92px; padding:6px 4px 8px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  border-radius:4px; cursor:default;
  transition:background-color 90ms var(--ease);
}
.icon-cell:hover{background:var(--hover)}
.icon-cell.sel{background:var(--row-selected-focused)}
.icon-cell .cap{
  width:100%; text-align:center; font-size:11.5px; color:var(--text-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.empty-state{
  display:flex; align-items:center; justify-content:center;
  height:100%; padding:24px;
  font-size:12px; color:var(--text-secondary); text-align:center;
}

/* ---------- 3.6 right tool window «Сведения» ------------------ */
.panel-scroll{flex:1 1 auto; min-height:0; padding:12px}
.prop-preview{
  display:flex; align-items:center; gap:12px;
  padding:12px; border-radius:4px;
  background:var(--inset);
}
.prop-preview .pp-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.prop-name{font-size:16px;font-weight:600;color:var(--text-primary);word-break:break-word}
.prop-type{font-size:12px;color:var(--text-secondary)}
.prop-table{margin-top:14px}
.prop-row{
  display:grid; grid-template-columns:84px minmax(0,1fr);
  align-items:start; gap:8px;
  min-height:var(--row-h); padding:3px 0;
  font-size:13px;
}
.prop-label{font-size:12px;color:var(--text-secondary);padding-top:1px}
.prop-value{color:var(--text-primary);word-break:break-word}
.prop-value.mono{font-family:var(--font-mono);font-size:12px}
.prop-section{
  margin:16px 0 6px;
  font-size:12px; font-weight:600; color:var(--text-secondary);
}
.access{display:flex;flex-direction:column;gap:2px}
.access .prop-row{grid-template-columns:84px minmax(0,1fr);min-height:22px;padding:2px 0}
.access .a-val{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.access .a-val .ic{width:13px;height:13px}
.a-yes{color:var(--success)}
.a-no{color:var(--text-secondary)}
.prop-actions{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%; max-width:280px; height:32px; border-radius:4px;
  font-size:13px;
  transition:background-color 90ms var(--ease), border-color 90ms var(--ease), color 90ms var(--ease);
}
.btn-primary{background:var(--accent); color:var(--accent-text-on); font-weight:500}
.btn-primary:hover{background:#4b83f2}
.btn-primary:active{background:#2f66da}
.btn-secondary{border:1px solid var(--divider-line); color:var(--text-primary)}
.btn-secondary:hover{background:var(--hover)}
.btn-secondary:active{background:var(--row-selected)}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- 7 · bottom tool window ----------------------------- */
.bottom-band{
  display:grid; grid-template-columns:var(--stripe-w) minmax(0,1fr) var(--stripe-w);
  background:var(--bg-chrome); overflow:hidden;
}
.bottom-win{
  display:flex; flex-direction:column;
  background:var(--bg-canvas);
  min-width:0; overflow:hidden;
}
.bw-head{
  position:relative;
  height:var(--chrome-h); flex:none;
  display:flex; align-items:center;
  background:var(--bg-chrome);
  padding-left:8px;
}
.bw-tabs{display:flex;align-items:stretch;height:100%}
.bw-tab{
  position:relative;
  display:flex;align-items:center;
  height:100%; padding:0 12px;
  font-size:13px; color:var(--text-secondary);
  transition:background-color 90ms var(--ease), color 90ms var(--ease);
}
.bw-tab:hover{background:var(--hover); color:var(--text-primary)}
.bw-tab.on{color:var(--text-primary)}
.bw-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.bw-head .tw-actions{padding-right:8px}
.bw-body{flex:1 1 auto; min-height:0; background:var(--bg-canvas); overflow-y:auto}

.op-row{
  display:grid; align-items:center;
  grid-template-columns:24px minmax(220px,1fr) 55% 56px 104px 112px;
  gap:8px;
  height:var(--row-h); padding:0 12px;
  font-size:13px;
}
.op-ico{display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.op-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-bar{height:4px;border-radius:2px;background:var(--divider-line);overflow:hidden}
.op-bar > i{display:block;height:100%;background:var(--accent);border-radius:2px}
.op-bar.done > i{background:var(--success)}
.op-bar.idle > i{background:var(--text-disabled)}
.op-pct,.op-speed{
  font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); text-align:right; white-space:nowrap;
}
.op-status{font-size:12px;color:var(--text-secondary);text-align:right;white-space:nowrap}

.log-line{
  font-family:var(--font-mono); font-size:12px; color:var(--text-code);
  padding:0 12px; line-height:18px; white-space:pre-wrap;
}
.log-line .t{color:var(--text-secondary)}
.term-line{
  font-family:var(--font-mono); font-size:12px;
  padding:0 12px; line-height:18px; white-space:pre-wrap; word-break:break-word;
}
.term-line.prompt{color:var(--text-primary)}
.term-line.prompt .cmd{color:var(--accent)}
.term-line.out{color:var(--text-secondary)}
.bw-empty{padding:16px;font-size:12px;color:var(--text-disabled)}

/* ---------- 9 · status bar ------------------------------------- */
.statusbar{
  background:var(--bg-chrome);
  display:flex; align-items:center;
  padding:0 12px 0 8px;
  font-size:12px; color:var(--text-secondary);
  user-select:none;
}
.sb-left{display:flex;align-items:center;gap:5px}
.sb-left .sb-chev{color:var(--text-disabled)}
.sb-left .sb-last{color:var(--text-primary)}
.sb-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sb-item .ic{color:var(--text-secondary)}

/* ---------- accessibility helpers ------------------------------ */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>

<div class="stage">
  <div class="window" id="window">

    <!-- ============ 1 · main toolbar ============ -->
    <header class="toolbar">
      <div class="tb-left">
        <button class="icon-btn lg" id="btn-menu" title="Главное меню" aria-label="Главное меню">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <div class="nav-group">
          <button class="icon-btn" id="nav-back" title="Назад" aria-label="Назад" disabled>
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-back"></use></svg>
          </button>
          <button class="icon-btn" id="nav-fwd" title="Вперёд" aria-label="Вперёд">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-fwd"></use></svg>
          </button>
          <button class="icon-btn" id="nav-up" title="Вверх" aria-label="Вверх">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-up"></use></svg>
          </button>
        </div>
        <div class="widget" id="loc-widget">
          <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-folder"></use></svg>
          <span class="loc-path" id="loc-path">/home/frimm/.cache</span>
          <svg class="ic w-chev" width="16" height="16" aria-hidden="true"><use href="#i-down"></use></svg>
          <div class="menu" id="loc-menu" role="menu">
            <button class="menu-item" role="menuitem" data-loc="cache">
              <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-folder"></use></svg>
              <span>/home/frimm/.cache</span>
              <svg class="ic m-check" width="14" height="14" data-check="cache" aria-hidden="true"><use href="#i-check"></use></svg>
            </button>
            <button class="menu-item" role="menuitem" data-loc="home">
              <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-home"></use></svg>
              <span>/home/frimm</span>
              <svg class="ic m-check" width="14" height="14" data-check="home" aria-hidden="true"><use href="#i-check"></use></svg>
            </button>
            <button class="menu-item" role="menuitem" data-loc="downloads">
              <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-folder"></use></svg>
              <span>/home/frimm/Загрузки</span>
              <svg class="ic m-check" width="14" height="14" data-check="downloads" aria-hidden="true"><use href="#i-check"></use></svg>
            </button>
          </div>
        </div>
        <span class="vdiv" aria-hidden="true"></span>
        <div class="widget" id="view-widget">
          <svg class="ic" id="view-icon" width="16" height="16" aria-hidden="true"><use href="#i-columns"></use></svg>
          <span id="view-label">Столбцы</span>
          <svg class="ic w-chev" width="16" height="16" aria-hidden="true"><use href="#i-down"></use></svg>
          <div class="menu" id="view-menu" role="menu">
            <button class="menu-item" role="menuitem" data-view="columns">
              <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-columns"></use></svg>
              <span>Столбцы</span>
              <svg class="ic m-check" width="14" height="14" data-vcheck="columns" aria-hidden="true"><use href="#i-check"></use></svg>
            </button>
            <button class="menu-item" role="menuitem" data-view="details">
              <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-list"></use></svg>
              <span>Подробно</span>
              <svg class="ic m-check" width="14" height="14" data-vcheck="details" aria-hidden="true"><use href="#i-check"></use></svg>
            </button>
            <button class="menu-item" role="menuitem" data-view="icons">
              <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-grid"></use></svg>
              <span>Значки</span>
              <svg class="ic m-check" width="14" height="14" data-vcheck="icons" aria-hidden="true"><use href="#i-check"></use></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="tb-right">
        <button class="icon-btn" id="btn-search" title="Поиск" aria-label="Поиск">
          <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-search"></use></svg>

          <button class="wbtn wclose" title="Закрыть" aria-label="Закрыть">

          </button>
        </div>
      </div>
    </header>

    <!-- ============ separator ============ -->
    <div class="sep" aria-hidden="true"></div>

    <!-- ============ 3 · continuous header band ============ -->
    <div class="band">
      <div class="stripe" aria-hidden="true"></div>

      <div class="tw-head">
        <button class="tw-title" id="tw-left-title" title="Свернуть панель «Места»">
          <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-down"></use></svg>
          <span>Места</span>
        </button>
        <div class="tw-actions">
          <button class="icon-btn sm" id="tw-left-refresh" title="Обновить" aria-label="Обновить">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-refresh"></use></svg>
          </button>
          <button class="icon-btn sm" title="Ещё" aria-label="Ещё">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-more"></use></svg>
          </button>
          <button class="icon-btn sm" id="tw-left-hide" title="Скрыть панель" aria-label="Скрыть панель">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-min"></use></svg>
          </button>
        </div>
      </div>

      <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Открытые папки"></div>

      <div class="tw-head">
        <button class="tw-title" id="tw-right-title" title="Свернуть панель «Сведения»">
          <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-down"></use></svg>
          <span id="tw-right-label">Сведения</span>
        </button>
        <div class="tw-actions">
          <button class="icon-btn sm" title="Ещё" aria-label="Ещё">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-more"></use></svg>
          </button>
          <button class="icon-btn sm" id="tw-right-hide" title="Скрыть панель" aria-label="Скрыть панель">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-min"></use></svg>
          </button>
        </div>
      </div>

      <div class="stripe" aria-hidden="true"></div>
    </div>

    <!-- ============ separator under header band ============ -->
    <div class="sep-line" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- ============ 5 · workspace ============ -->
    <div class="workspace">
      <div class="stripe" id="stripe-left">
        <button class="stripe-btn on" data-tool="places" title="Места">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-home"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="files" title="Файлы">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-file"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="bookmarks" title="Закладки">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-bookmark"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="recent" title="Недавние">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-clock"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="devices" title="Устройства">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-drive"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="network" title="Сеть">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-network"></use></svg>
        </button>
        <span class="stripe-sep" aria-hidden="true"></span>
        <button class="stripe-btn" data-tool="trash" title="Корзина">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-trash"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="terminal" title="Терминал">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-terminal"></use></svg>
        </button>
        <button class="stripe-btn" data-tool="settings" title="Настройки">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-gear"></use></svg>
        </button>
      </div>

      <!-- left tool window -->
      <aside class="panel" id="panel-left">
        <div class="panel-toolbar">
          <label class="search-field">
            <svg class="ic" width="14" height="14" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="tree-search" type="text" placeholder="Поиск…" aria-label="Поиск по местам" />
          </label>
          <button class="icon-btn" title="Сортировка" aria-label="Сортировка">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-sort"></use></svg>
          </button>
          <button class="icon-btn" title="Фильтр" aria-label="Фильтр">
            <svg class="ic" width="16" height="16" aria-hidden="true"><use href="#i-list"></use></svg>
          </button>
        </div>
        <div class="tree scroll" id="tree" role="tree" aria-label="Места"></div>
      </aside>

      <!-- editor -->
      <main class="editor" id="editor">
        <div class="crumbs" id="crumbs"></div>
        <div class="thead" id="file-head"></div>
        <div class="list scroll" id="file-list" role="listbox" aria-label="Содержимое папки"></div>
      </main>

      <!-- right tool window -->
      <aside class="panel" id="panel-right">
        <div class="panel-scroll scroll" id="details"></div>
      </aside>

      <div class="stripe" id="stripe-right">
        <button class="stripe-btn on" data-rtool="details" title="Сведения">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-info"></use></svg>
        </button>
        <button class="stripe-btn" data-rtool="preview" title="Предпросмотр">
          <svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-eye"></use></svg>

  const ic = (n,size,cls) => '<svg class="ic '+(cls||'')+'" width="'+size+'" height="'+size+'" aria-hidden="true"><use href="#i-'+n+'"></use></svg>';

  function clock(){
    const d = new Date();
    const p = n => (n<10?'0':'')+n;
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  function logLine(text){
    state.log.push('['+clock()+'] '+text);

  /* ================= toolbar ================= */

  function fit(){
    const s = Math.min((window.innerWidth-32)/1440, (window.innerHeight-32)/900, 1);
    document.documentElement.style.setProperty('--win-scale', s > 0 ? s : 0.2);
  }
  window.addEventListener('resize', fit);
  fit();

  function setTheme(next){
    state.theme = next;
    document.documentElement.setAttribute('data-theme', next);
    const btn = $('#btn-theme');
    $('#theme-icon').innerHTML = '<use href="#'+(next==='dark'?'i-sun':'i-moon')+'"></use>';
    btn.setAttribute('title', next==='dark' ? 'Сменить тему на светлую' : 'Сменить тему на тёмную');
  }
  $('#btn-theme').addEventListener('click', function(){ setTheme(state.theme==='dark'?'light':'dark'); });

  /* dropdown menus */
  function closeMenus(except){
    $$('.menu.open').forEach(function(m){ if(m!==except) m.classList.remove('open'); });
  }
  function toggleMenu(menu){
    var open = menu.classList.contains('open');
    closeMenus(null);
    if(!open) menu.classList.add('open');
  }
  document.addEventListener('click', function(e){
    var m = e.target.closest ? e.target.closest('.menu') : null;
    var w = e.target.closest ? e.target.closest('.widget') : null;
    if(!m && !w) closeMenus(null);
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMenus(null); });

  $('#loc-widget').addEventListener('click', function(e){
    if(e.target.closest('.menu')) return;
    e.stopPropagation(); toggleMenu($('#loc-menu'));
  });
  $('#view-widget').addEventListener('click', function(e){
    if(e.target.closest('.menu')) return;
    e.stopPropagation(); toggleMenu($('#view-menu'));
  });
  $('#bw-more').addEventListener('click', function(e){
    if(e.target.closest('.menu')) return;
    e.stopPropagation(); toggleMenu($('#bw-menu'));
  });

    if(state.tabs.indexOf(tab)===-1){
      state.tabs.push(tab);

    state.active = tab;
    if(!fromHistory){
      state.history = state.history.slice(0, state.hIndex+1);
      state.history.push(tab);
      state.hIndex = state.history.length-1;

    renderBottom();

      state.active = state.tabs.length ? state.tabs[Math.min(idx, state.tabs.length-1)] : null;
      state.history = state.history.filter(function(h){ return h!==id; });
      state.hIndex = Math.max(0, state.history.length-1);

    return out;

    if(!loc.groups) return null;
    for(var i=0;i<loc.groups.length;i++){ if(loc.groups[i].rows.some(function(r){ return r.n===name; })) return loc.groups[i].id; }
    return null;

    if(state.view==='icons'){
      head.style.display='none';
      var rows = allRows(loc);
      list.innerHTML = '<div class="icon-grid">' + rows.map(function(r){
        var on = state.sel[loc.id]===r.n;
        return '<div class="icon-cell'+(on?' sel':'')+'" role="option" aria-selected="'+(on?'true':'false')+'" data-name="'+esc(r.n)+'" data-loc="'+loc.id+'" tabindex="0">'
          + ic(r.type==='folder'?'folder':'file',40)
          + '<span class="cap">'+esc(r.n)+'</span></div>';
      }).join('') + '</div>';
      renderCrumbs(loc);
      return;
    }
    head.style.gridTemplateColumns = colsDef();
    head.innerHTML = '<span class="h-name">Имя</span><span class="h-num">Размер</span><span class="h-num">Изменён</span>'
      + (state.view==='details' ? '<span class="h-num">Тип</span>' : '');
    list.style.setProperty('--cols', colsDef());
    $('#editor').style.setProperty('--cols', colsDef());

    var html = '';
    if(loc.groups){
      loc.groups.forEach(function(g,i){
        var closed = state.collapsed.indexOf(g.id)!==-1;
        html += '<div class="group'+(i===0?' first':'')+(closed?' closed':'')+'" data-group="'+g.id+'" role="button" tabindex="0">'
          + '<span class="gtexp">'+ic('down',12,'rot')+'</span><span class="glabel">'+esc(g.label)+'</span></div>';
        if(!closed){
          g.rows.forEach(function(r){ html += rowHtml(r, loc, state.sel[loc.id]===r.n); });
        }
      });
    } else {
      loc.rows.forEach(function(r){ html += rowHtml(r, loc, state.sel[loc.id]===r.n); });
    }
    html += '<div class="list-summary">'+esc(loc.summary)+'</div>';
    list.innerHTML = html;
    renderCrumbs(loc);
  }

  function renderCrumbs(loc){
    var c = $('#crumbs');
    var html = ic(loc.id==='home'?'home':'folder',12,'c-ico');
    html += '<span>'+esc(loc.crumbs[0])+'</span>';
    for(var i=1;i<loc.crumbs.length;i++){
      html += '<svg class="ic c-chev" width="10" height="10" aria-hidden="true"><use href="#i-right"></use></svg>';
      html += '<span class="'+(i===loc.crumbs.length-1?'c-last':'')+'">'+esc(loc.crumbs[i])+'</span>';
    }
    html += '<span class="c-sort">'+esc(loc.sort)+'</span>';
    c.innerHTML = html;
  }

  $('#file-list').addEventListener('click', function(e){
    var row = e.target.closest('[data-name]');
    if(!row) return;
    selectRow(row.getAttribute('data-loc'), row.getAttribute('data-name'));
  });
  $('#file-list').addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var row = e.target.closest('[data-name]');
    if(!row) return;
    e.preventDefault();
    selectRow(row.getAttribute('data-loc'), row.getAttribute('data-name'));
  });
  $('#file-list').addEventListener('click', function(e){
    var grp = e.target.closest('[data-group]');
    if(!grp) return;
    var id = grp.getAttribute('data-group');
    var i = state.collapsed.indexOf(id);
    if(i===-1) state.collapsed.push(id); else state.collapsed.splice(i,1);
    renderList();
  });
  $('#file-list').addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var grp = e.target.closest('[data-group]');
    if(!grp) return;
    e.preventDefault();
    grp.click();
  });

  function selectRow(locId, name){
    var loc = LOCATIONS[locId];
    if(!loc) return;
    var row = null;
    allRows(loc).forEach(function(r){ if(r.n===name) row=r; });
    if(!row) return;
    state.sel[locId] = name;
    renderList();
    renderDetails();
  }

  /* ================= right panel ================= */

  function findRow(locId, name){
    var loc = LOCATIONS[locId]; var row=null;
    if(!loc) return null;
    allRows(loc).forEach(function(r){ if(r.n===name) row=r; });
    return row;
  }
  function locCounts(loc){
    var f = /(\d+)\s+(?:папок|папк[аи])/.exec(loc.summary||'');
    var fl = /(\d+)\s+(?:файлов|файл[аов])/.exec(loc.summary||'');
    return {folders: f ? f[1] : '—', files: fl ? fl[1] : '—'};
  }

  function renderDetails(){
    var box = $('#details');
    var loc = LOCATIONS[state.active];
    var name = state.sel[state.active];
    var row = findRow(state.active, name);
    $('#tw-right-label').textContent = state.rightMode==='preview' ? 'Предпросмотр' : 'Сведения';
    if(!loc || !row){
      box.innerHTML = '<div class="empty-state">Ничего не выбрано</div>';
      return;
    }
    var isFolder = row.type==='folder';
    var path = loc.path + '/' + row.n;
    var html = '';
    html += '<div class="prop-preview">'
      + ic(isFolder?'folder':'file',64)
      + '<div class="pp-text"><div class="prop-name">'+esc(row.n)+'</div><div class="prop-type">'+esc(isFolder?'Папка':'Файл')+'</div></div>'
      + '</div>';

    if(state.rightMode==='preview'){
      html += '<div class="prop-table">'
        + '<div class="prop-row"><span class="prop-label">Размер</span><span class="prop-value mono">'+esc(row.size)+'</span></div>'
        + '<div class="prop-row"><span class="prop-label">Изменён</span><span class="prop-value mono">'+esc(row.date)+'</span></div>'
        + '<div class="prop-row"><span class="prop-label">Путь</span><span class="prop-value mono">'+esc(path)+'</span></div>'
        + '</div>';
      box.innerHTML = html;
      return;
    }

    html += '<div class="prop-table">'
      + '<div class="prop-row"><span class="prop-label">Тип</span><span class="prop-value">'+esc(isFolder?'Папка':'Файл')+'</span></div>'
      + '<div class="prop-row"><span class="prop-label">Размер</span><span class="prop-value mono">'+esc(row.size)+'</span></div>'
      + '<div class="prop-row"><span class="prop-label">Изменён</span><span class="prop-value mono">'+esc(row.date)+'</span></div>'
      + '<div class="prop-row"><span class="prop-label">Создан</span><span class="prop-value mono">'+esc(row.created)+'</span></div>'
      + '<div class="prop-row"><span class="prop-label">Владелец</span><span class="prop-value">frimm</span></div>'
      + '<div class="prop-row"><span class="prop-label">Группа</span><span class="prop-value">frimm</span></div>'
      + '<div class="prop-row"><span class="prop-label">Права</span><span class="prop-value mono">'+esc(isFolder?'drwxr-xr-x':'-rw-r--r--')+'</span></div>'
      + '<div class="prop-row"><span class="prop-label">Путь</span><span class="prop-value mono">'+esc(path)+'</span></div>'
      + '</div>';

    html += '<div class="prop-section">Доступ</div><div class="access">'
      + '<div class="prop-row"><span class="prop-label">Чтение</span><span class="prop-value a-val">'+ic('check',13,'a-yes')+'Разрешено</span></div>'
      + '<div class="prop-row"><span class="prop-label">Запись</span><span class="prop-value a-val">'+ic('check',13,'a-yes')+'Разрешено</span></div>'
      + '<div class="prop-row"><span class="prop-label">'+(isFolder?'Вход':'Исполнение')+'</span><span class="prop-value a-val">'+ic(isFolder?'check':'x',13,isFolder?'a-yes':'a-no')+(isFolder?'Разрешено':'Запрещено')+'</span></div>'
      + '</div>';

    html += '<div class="prop-section">Содержимое</div><div class="access">';
    if(isFolder){
      var cnt = locCounts(loc);
      html += '<div class="prop-row"><span class="prop-label">Папок</span><span class="prop-value mono">'+esc(cnt.folders)+'</span></div>'
           + '<div class="prop-row"><span class="prop-label">Файлов</span><span class="prop-value mono">'+esc(cnt.files)+'</span></div>';
    } else {
      html += '<div class="prop-row"><span class="prop-label">Формат</span><span class="prop-value">'+esc(row.contents)+'</span></div>';
    }
    html += '</div>';

    html += '<div class="prop-actions">'
      + '<button class="btn btn-primary" id="btn-open">Открыть</button>'
      + '<button class="btn btn-secondary" id="btn-reveal">Показать в папке</button>'
      + '</div>';
    box.innerHTML = html;

    $('#btn-open').addEventListener('click', function(){
      logLine('открыто — '+loc.path+'/'+row.n);
    });
    $('#btn-reveal').addEventListener('click', function(){
      logLine('показать в папке — '+row.n);
    });
  }

  /* ================= left tree ================= */

  function treeMatches(node, q){
    if(node.k==='group') return node.label.toLowerCase().indexOf(q)>=0;
    return node.label.toLowerCase().indexOf(q)>=0;
  }
  function renderTree(){
    var tree = $('#tree');
    var q = state.treeQuery.trim().toLowerCase();
    var html = '';
    TREE.forEach(function(node){
      if(node.k==='group'){
        var visible = !q;
        if(!visible){
          var kids = TREE.filter(function(c){ return c.parent===node.id; });
          visible = treeMatches(node,q) || kids.some(function(c){ return treeMatches(c,q); });
        }
        if(!visible) return;
        html += '<div class="trow tgroup'+(node.open?'':' closed')+'" role="treeitem" tabindex="0" aria-expanded="'+(node.open?'true':'false')+'" data-tnode="'+node.id+'" data-kind="group">'
          + '<span class="texp">'+ic('down',12,'rot')+'</span>'
          + '<span class="tlabel">'+esc(node.label)+'</span></div>';
        if(node.open){
          TREE.forEach(function(child){
            if(child.parent!==node.id) return;
            if(q && !treeMatches(child,q) && !treeMatches(node,q)) return;
            html += treeItemHtml(child);
          });
        }
      } else {
        if(node.parent){
          var parent = TREE.filter(function(p){ return p.id===node.parent; })[0];
          if(parent){
            if(q){
              if(!treeMatches(node,q) && !treeMatches(parent,q)) return;
              if(!parent.open) return;
            } else {
              if(!parent.open) return;
            }
          }
        }
        html += treeItemHtml(node);
      }
    });
    tree.innerHTML = html;
  }
  function treeItemHtml(node){
    var usage = '';
    if(node.usage){
      usage = '<span class="usage'+(node.usage>=90?'':' warn')+'"><i style="width:'+node.usage+'%"></i></span>';
    }
    return '<div class="trow'+(state.treeSel===node.id?' sel':'')+(node.open===false?' closed':'')+'" role="treeitem" tabindex="0" aria-selected="'+(state.treeSel===node.id?'true':'false')+'" data-tnode="'+node.id+'" data-kind="item"'
      + (node.tab ? ' data-tab="'+node.tab+'"' : '')
      + ' style="padding-left:'+(node.lvl===1?6:22)+'px">'
      + '<span class="texp">'+(node.open!==undefined?ic('down',12,'rot'):'')+'</span>'
      + ic(node.icon,16,'tico')
      + '<span class="tlabel">'+esc(node.label)+'</span>'
      + usage
      + '</div>';
  }

  $('#tree').addEventListener('click', function(e){
    var row = e.target.closest('[data-tnode]');
    if(!row) return;
    var id = row.getAttribute('data-tnode');
    var node = TREE.filter(function(n){ return n.id===id; })[0];
    if(!node) return;
    if(node.k==='group'){
      node.open = !node.open;
      renderTree();
      return;
    }
    if(node.open!==undefined && e.target.closest('.texp')){
      node.open = !node.open;
      renderTree();
      return;
    }
    state.treeSel = id;
    renderTree();
    var tab = row.getAttribute('data-tab');
    if(tab && tab!==state.active) navigate(tab);
  });
  $('#tree').addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var row = e.target.closest('[data-tnode]');
    if(!row) return;
    e.preventDefault();
    row.click();
  });
  $('#tree-search').addEventListener('input', function(){
    state.treeQuery = this.value;
    renderTree();
    $('#tree').scrollTop = 0;
  });

  /* ================= bottom tool window ================= */

  function openBottom(tab){
    state.bottomTab = tab;
    win.classList.remove('no-bottom');
    $$('.bw-tab').forEach(function(t){
      var on = t.getAttribute('data-btab')===tab;
      t.classList.toggle('on',on);
      t.setAttribute('aria-selected', on?'true':'false');
    });
    renderBottom();
  }
  $$('.bw-tab').forEach(function(t){
    t.addEventListener('click', function(){ openBottom(t.getAttribute('data-btab')); });
  });
  $('#bw-collapse').addEventListener('click', function(){
    var hidden = win.classList.toggle('no-bottom');
    this.setAttribute('title', hidden ? 'Развернуть окно' : 'Свернуть окно');
  });

  function renderBottom(){
    var body = $('#bw-body');
    if(state.bottomTab==='ops'){
      body.innerHTML = OPERATIONS.map(function(op){
        var cls = op.bar==='done'?'done':(op.bar==='idle'?'idle':'');
        return '<div class="op-row">'
          + '<span class="op-ico">'+ic(op.ico,16)+'</span>'
          + '<span class="op-name">'+esc(op.name)+'</span>'
          + '<span class="op-bar '+cls+'"><i style="width:'+op.pct+'%"></i></span>'
          + '<span class="op-pct">'+op.pct+' %</span>'
          + '<span class="op-speed">'+esc(op.val)+'</span>'
          + '<span class="op-status '+op.st+'">'+esc(op.status)+'</span>'
          + '</div>';
      }).join('');
      return;
    }
    if(state.bottomTab==='log'){
      body.innerHTML = state.log.length
        ? state.log.map(function(l){
            var m = /^(\[[^\]]+\])/.exec(l);
            return '<div class="log-line">'+(m?'<span class="t">'+esc(m[1])+'</span> ':'')+esc(l.slice(m?m[1].length:0))+'</div>';
          }).join('')
        : '<div class="bw-empty">Журнал пуст</div>';
      return;
    }
    var loc = LOCATIONS[state.active];
    var home = loc ? loc.path.replace(/^\/home\/frimm/,'~') : '~';
    body.innerHTML = '<div class="term-line prompt">frimm@volna:'+esc(home)+'$ <span class="cmd">ls -la | head</span></div>'
      + TERM_OUT.map(function(l){ return '<div class="term-line out">'+esc(l)+'</div>'; }).join('');
  }

  /* ================= stripes ================= */

  $('#stripe-left').addEventListener('click', function(e){
    var b = e.target.closest('[data-tool]');
    if(!b) return;
    var tool = b.getAttribute('data-tool');
    $$('#stripe-left .stripe-btn').forEach(function(x){ x.classList.toggle('on', x===b); });
    if(tool==='places'){ win.classList.toggle('no-left'); return; }
    if(tool==='terminal'){ openBottom('term'); return; }
    if(tool==='settings'){ openBottom('log'); logLine('настройки — открыт журнал сессии'); return; }
    logLine(tool+' — раздел открыт');
  });
  $('#stripe-right').addEventListener('click', function(e){
    var b = e.target.closest('[data-rtool]');
    if(!b) return;
    var tool = b.getAttribute('data-rtool');
    if(tool==='details' || tool==='preview'){
      state.rightMode = tool;
      win.classList.remove('no-right');
      renderDetails();
      $$('#stripe-right .stripe-btn').forEach(function(x){ x.classList.toggle('on', x===b); });
      return;
    }
    if(tool==='log'){ openBottom('log'); return; }
    if(tool==='terminal'){ openBottom('term'); return; }
    if(tool==='settings'){ openBottom('log'); logLine('настройки — открыт журнал сессии'); }
  });
  $('#tw-left-hide').addEventListener('click', function(){ win.classList.add('no-left'); });
  $('#tw-right-hide').addEventListener('click', function(){ win.classList.add('no-right'); });
  $('#tw-left-title').addEventListener('click', function(){ win.classList.toggle('no-left'); });
  $('#tw-right-title').addEventListener('click', function(){ win.classList.toggle('no-right'); });

  /* ================= status bar ================= */

  function renderStatus(){
    var loc = LOCATIONS[state.active];
    if(!loc){
      $('#sb-left').innerHTML = '';
      $('#sb-counts').textContent = '—';
      return;
    }
    var html = ic(loc.id==='home'?'home':'folder',12);
    html += '<span>'+esc(loc.crumbs[0])+'</span>';
    for(var i=1;i<loc.crumbs.length;i++){
      html += '<svg class="ic sb-chev" width="10" height="10" aria-hidden="true"><use href="#i-right"></use></svg>';
      html += '<span class="'+(i===loc.crumbs.length-1?'sb-last':'')+'">'+esc(loc.crumbs[i])+'</span>';
    }
    $('#sb-left').innerHTML = html;
    $('#sb-counts').textContent = loc.summary;
  }

  /* ================= boot ================= */

  setTheme('dark');
  renderTabs();
  renderTree();
  renderList();
  renderDetails();
  renderStatus();
  renderBottom();
  syncLocation();
  setView('columns');
  updateNav();
})();
</script>
</body>
</html>
