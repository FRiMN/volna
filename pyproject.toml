# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml

[project]
name = "volna"
description = "«Волна» — плотный файловый менеджер для Linux-десктопа (рабочее название)"
keywords = ["file-manager", "desktop", "linux", "gui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
]
readme = "README.md"
authors = [{ name = "Nik Volkov", email = "freezemandix@ya.ru" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.gui-scripts]
volna = "volna.main:main"

[dependency-groups]
dev = [
    "ruff~=0.17.4",
    "pytest~=9.2.0",
    "invoke~=3.0.3",
    "mypy~=2.4",
    "pytest-xdist~=3.8.0",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/volna/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/volna"]

[tool.hatch.build.targets.sdist]
exclude = ["/design", "/reference", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -n 4 --dist loadscope"
markers = [
    "slow: long-running and non-functional (timing/memory) tests",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["design", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E741", # Ambiguous variable name
    "E501", # Line too long
]

[tool.mypy]
# The floor of requires-python: the code must type-check on the oldest
# interpreter we claim to support, not only on the one we run.
python_version = "3.11"
files = ["src/volna"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# gi ships no type information for the installed PyGObject (3.48), and the
# published stubs target a newer GTK than we run, so importing them would
# check the code against an API it never sees. GTK is Any here.
module = ["gi", "gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Rules that need typed GTK: every Gtk.* symbol is Any, so subclassing Any
# and returning Any from a GTK getter say nothing about this code. Turning
# them off here keeps the GTK layer checked for everything that does not
# depend on the toolkit's types; revisit when PyGObject stubs match runtime.
module = [
    "volna.main",
    "volna.window",
    "volna.tab",
    "volna.glyph",
    "volna.views.*",
    "volna.view_panel.*",
]
disallow_subclassing_any = false
warn_return_any = false
